openapi: 3.0.3
info:
  version: 1.0.0
  title: Metrics Service API
  description: |-
    Metrics collection and monitoring service for application and infrastructure metrics.

    **Features:**
    - Time-series metrics collection
    - Custom metric definitions
    - Metric aggregation and querying
    - Dashboard integration
    - Alert management

  termsOfService: https://example.com/terms
  contact:
    name: API Support
    url: https://github.com/example/metrics-service/issues
  license:
    name: MIT License
    url: https://github.com/example/metrics-service/blob/main/LICENSE

servers:
  - url: "http://localhost:8083"
    description: Development server
  - url: "https://metrics.example.com"
    description: Production server

tags:
  - name: metrics
    description: Metrics collection and querying
  - name: dashboards
    description: Dashboard management
  - name: alerts
    description: Alert management

paths:
  /v1/metrics:
    get:
      tags:
        - metrics
      summary: Query metrics
      description: Retrieve metrics data with filtering and aggregation
      operationId: queryMetrics
      security:
        - BearerAuth: []
      parameters:
        - name: metric_name
          in: query
          description: Name of the metric to query
          schema:
            type: string
          required: true
        - name: start_time
          in: query
          description: Start time for query range
          schema:
            type: string
            format: date-time
          required: true
        - name: end_time
          in: query
          description: End time for query range
          schema:
            type: string
            format: date-time
          required: true
        - name: aggregation
          in: query
          description: Aggregation function
          schema:
            type: string
            enum: [avg, sum, min, max, count]
        - name: interval
          in: query
          description: Time interval for aggregation
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
        - name: labels
          in: query
          description: Label filters (key=value format, comma-separated)
          schema:
            type: string
      responses:
        '200':
          description: Metrics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags:
        - metrics
      summary: Record metrics
      description: Record new metric data points
      operationId: recordMetrics
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMetricsRequest'
      responses:
        '201':
          description: Metrics recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/metrics/names:
    get:
      tags:
        - metrics
      summary: List metric names
      description: Retrieve available metric names
      operationId: listMetricNames
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of metric names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricNamesResponse'

  /v1/metrics/definitions:
    get:
      tags:
        - metrics
      summary: List metric definitions
      description: Retrieve metric definitions and metadata
      operationId: listMetricDefinitions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of metric definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinitionsResponse'

    post:
      tags:
        - metrics
      summary: Create metric definition
      description: Create a new metric definition
      operationId: createMetricDefinition
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetricDefinitionRequest'
      responses:
        '201':
          description: Metric definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /v1/dashboards:
    get:
      tags:
        - dashboards
      summary: List dashboards
      description: Retrieve available dashboards
      operationId: listDashboards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of dashboards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

    post:
      tags:
        - dashboards
      summary: Create dashboard
      description: Create a new dashboard
      operationId: createDashboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardRequest'
      responses:
        '201':
          description: Dashboard created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /v1/alerts:
    get:
      tags:
        - alerts
      summary: List alerts
      description: Retrieve alert rules and incidents
      operationId: listAlerts
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by alert status
          schema:
            type: string
            enum: [active, resolved, suppressed]
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

    post:
      tags:
        - alerts
      summary: Create alert rule
      description: Create a new alert rule
      operationId: createAlertRule
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRuleRequest'
      responses:
        '201':
          description: Alert rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

components:
  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data (varies by endpoint)
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: "validation_error"
        message:
          type: string
          example: "Invalid request parameters"

    MetricsQueryResponse:
      type: object
      properties:
        metric_name:
          type: string
          example: "cpu_usage"
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
        aggregation:
          type: string
          example: "avg"
        interval:
          type: string
          example: "5m"

    DataPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
        value:
          type: number
          example: 75.5
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            instance: "web-server-1"
            region: "us-west-2"

    RecordMetricsRequest:
      type: object
      required:
        - metrics
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricDataPoint'

    MetricDataPoint:
      type: object
      required:
        - name
        - value
        - timestamp
      properties:
        name:
          type: string
          example: "cpu_usage"
        value:
          type: number
          example: 75.5
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            instance: "web-server-1"
            region: "us-west-2"

    MetricNamesResponse:
      type: object
      properties:
        metric_names:
          type: array
          items:
            type: string
          example: ["cpu_usage", "memory_usage", "request_count"]

    MetricDefinitionsResponse:
      type: object
      properties:
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/MetricDefinition'

    MetricDefinition:
      type: object
      properties:
        name:
          type: string
          example: "cpu_usage"
        description:
          type: string
          example: "CPU usage percentage"
        unit:
          type: string
          example: "percent"
        type:
          type: string
          enum: [counter, gauge, histogram]
          example: "gauge"
        labels:
          type: array
          items:
            type: string
          example: ["instance", "region"]
        created_at:
          type: string
          format: date-time

    CreateMetricDefinitionRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: "response_time"
        description:
          type: string
          example: "HTTP response time in milliseconds"
        unit:
          type: string
          example: "milliseconds"
        type:
          type: string
          enum: [counter, gauge, histogram]
          example: "histogram"
        labels:
          type: array
          items:
            type: string
          example: ["endpoint", "method"]

    CreateDashboardRequest:
      type: object
      required:
        - name
        - panels
      properties:
        name:
          type: string
          example: "System Overview"
        description:
          type: string
          example: "Main system metrics dashboard"
        panels:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPanel'

    DashboardPanel:
      type: object
      required:
        - title
        - metric_name
        - visualization
      properties:
        title:
          type: string
          example: "CPU Usage"
        metric_name:
          type: string
          example: "cpu_usage"
        visualization:
          type: string
          enum: [line, bar, gauge, stat]
          example: "line"
        position:
          $ref: '#/components/schemas/PanelPosition'
        queries:
          type: array
          items:
            type: string
          example: ["avg(cpu_usage)", "max(cpu_usage)"]

    PanelPosition:
      type: object
      properties:
        x:
          type: integer
          example: 0
        y:
          type: integer
          example: 0
        width:
          type: integer
          example: 12
        height:
          type: integer
          example: 6

    CreateAlertRuleRequest:
      type: object
      required:
        - name
        - metric_name
        - condition
        - threshold
      properties:
        name:
          type: string
          example: "High CPU Usage Alert"
        description:
          type: string
          example: "Alert when CPU usage exceeds 80%"
        metric_name:
          type: string
          example: "cpu_usage"
        condition:
          type: string
          enum: [gt, lt, gte, lte, eq]
          example: "gt"
        threshold:
          type: number
          example: 80
        duration:
          type: string
          example: "5m"
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            severity: "warning"
            team: "platform"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
