              schema:
                oneOf:
                  - $ref: '#/components/schemas/TOTPPhoneChallengeResponse'
                  - $ref: '#/components/schemas/WebAuthnChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/factors/{factorId}/verify:
    post:
      summary: Verify a challenge on a factor.
      tags:
        - auth:user
      security:
        - APIKeyAuth: []
          UserAuth: []
      parameters:
        - name: factorId
          in: path
          required: true
          example: 2b306a77-21dc-4110-ba71-537cb56b9e98
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge_id
              properties:
                challenge_id:
                  type: string
                  format: uuid
                code:
                  type: string
                webauthn:
                  type: object
                  required:
                    - rpId
                    - rpOrigins
                    - type
                    - credential_response
                  properties:
                    rpId:
                      type: string
                      description: The relying party identifier
                    rpOrigins:
                      type: array
                      items:
                        type: string
                      minItems: 1
                      description: List of allowed origins for WebAuthn
                    type:
                      type: string
                      enum:
                        - create
                        - request
                      description: Type of WebAuthn operation
                    credential_response:
                      type: object
                      description: WebAuthn credential response from the client
      responses:
        '200':
          description: >
            This challenge has been verified. Client libraries should replace their stored access and refresh tokens
            with the ones provided in this response. These new credentials have an increased Authenticator Assurance
            Level (AAL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseSchema'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/factors/{factorId}:
    delete:
