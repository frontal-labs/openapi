  /v1/auth/oauth/clients/register:
    post:
      summary: Register a new OAuth client dynamically (public endpoint).
      description: >
        Allows applications to register as OAuth clients with this server dynamically. This follows the OAuth 2.0
        Dynamic Client Registration Protocol. Only available when OAuth server is enabled and dynamic registration is
        allowed (set `GOTRUE_OAUTH_SERVER_ENABLED=true` and `GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION=true` for
        self-hosted or enable both settings in Frontal Dashboard).
      tags:
        - auth:oauth-server
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - client_name
                - redirect_uris
              properties:
                client_name:
                  type: string
                  description: Human-readable name of the client application
                client_uri:
                  type: string
                  format: uri
                  description: URL of the client application's homepage
                logo_uri:
                  type: string
                  format: uri
                  description: URL of the client application's logo
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Array of redirect URIs used by the client (maximum 10)
                client_type:
                  type: string
                  enum:
                    - public
                    - confidential
                  description: >
                    Type of the client. Optional. If not provided, will be inferred from token_endpoint_auth_method or
                    defaults to 'confidential'. Public clients are used for applications that cannot securely store
                    credentials (e.g., SPAs, mobile apps). Confidential clients can securely store credentials (e.g.,
                    server-side applications).
                token_endpoint_auth_method:
                  type: string
                  enum:
                    - none
                    - client_secret_basic
                    - client_secret_post
                  description: >
                    Authentication method for the token endpoint. Optional. 'none' is for public clients,
                    'client_secret_basic' and 'client_secret_post' are for confidential clients. If provided, must be
                    consistent with client_type. If not provided, will be inferred from client_type.
                grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - refresh_token
                  description: OAuth grant types the client will use (defaults to both if not specified)
                response_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - code
                  description: OAuth response types the client will use
                scope:
                  type: string
                  description: Space-separated list of scope values
      responses:
        '201':
          description: OAuth client registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientSchema'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/oauth/token:
    post:
      summary: OAuth 2.1 Token endpoint
      description: >
        Issues access tokens in exchange for authorization codes or refresh tokens. Supports authorization_code and
        refresh_token grant types. Only available when OAuth server is enabled (set `GOTRUE_OAUTH_SERVER_ENABLED=true`
        for self-hosted or enable in Frontal Dashboard).
      tags:
        - auth:oauth-server
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                  description: The grant type being used
                code:
                  type: string
                  description: Authorization code (required for authorization_code grant)
                redirect_uri:
                  type: string
                  format: uri
                  description: Redirect URI (required for authorization_code grant)
                code_verifier:
                  type: string
                  description: PKCE code verifier (required for authorization_code grant)
                refresh_token:
                  type: string
                  description: Refresh token (required for refresh_token grant)
                client_id:
                  type: string
                  description: OAuth client identifier
                client_secret:
                  type: string
                  description: OAuth client secret (for confidential clients)
      responses:
        '200':
          description: Access token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The access token
                  token_type:
                    type: string
                    example: Bearer
                    description: Type of token issued
                  expires_in:
                    type: integer
                    description: Lifetime in seconds of the access token
                  refresh_token:
                    type: string
                    description: Refresh token (if applicable)
                  scope:
                    type: string
                    description: Authorized scopes
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
      x-service: auth
  /v1/auth/oauth/authorize:
    get:
      summary: OAuth 2.1 Authorization endpoint
      description: >
        Initiates the OAuth authorization code flow. Redirects users to login and authorize the requesting application.
        Only available when OAuth server is enabled (set `GOTRUE_OAUTH_SERVER_ENABLED=true` for self-hosted or enable in
        Frontal Dashboard).
      tags:
        - auth:oauth-server
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The client identifier
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: Client's redirect URI
        - name: scope
          in: query
          schema:
            type: string
          description: Requested access scope
        - name: state
          in: query
          schema:
            type: string
          description: State parameter for CSRF protection
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: PKCE code challenge
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
          description: PKCE code challenge method
      responses:
        '302':
          description: Redirect to login or authorization page
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      x-service: auth
