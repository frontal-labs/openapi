  /v1/auth/admin/custom-providers:
    get:
      summary: List all custom OIDC/OAuth providers
      description: >
        Retrieves a list of all custom OAuth 2.0 and OIDC provider configurations. Optionally filter by provider type.
        Only available when custom OIDC/OAuth providers are enabled (set `GOTRUE_CUSTOM_OAUTH_ENABLED=true` for
        self-hosted or enable in Frontal Dashboard).
      tags:
        - auth:admin
        - auth:oauth-client
      security:
        - APIKeyAuth: []
          AdminAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by provider type
          schema:
            type: string
            enum:
              - oauth2
              - oidc
      responses:
        '200':
          description: List of custom OIDC/OAuth providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomOAuthProviderSchema'
        '400':
          description: Invalid type parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                invalid_type:
                  summary: validation_failed
                  value:
                    error_code: validation_failed
                    msg: type must be either 'oauth2' or 'oidc'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
      x-service: auth
    post:
      summary: Create a new custom OIDC/OAuth provider
      description: >
        Creates a new custom OAuth 2.0 or OIDC provider configuration. Required fields differ based on provider_type.
        Only available when custom OIDC/OAuth providers are enabled. For OIDC providers, the server fetches and
        validates the OpenID Connect discovery document from the issuer's well-known endpoint (or the provided
        discovery_url) at creation time. This ensures the issuer is reachable and correctly configured before the
        provider is stored.
      tags:
        - auth:admin
        - auth:oauth-client
      security:
        - APIKeyAuth: []
          AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_type
                - identifier
                - name
                - client_id
                - client_secret
              properties:
                provider_type:
                  type: string
                  enum:
                    - oauth2
                    - oidc
                  description: Type of OAuth provider
                identifier:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: >-
                    Unique identifier (will be prefixed with 'custom:' automatically). Cannot use reserved provider
                    names.
                  example: mycompany
                name:
                  type: string
                  description: Human-readable display name
                  example: My Company SSO
                client_id:
                  type: string
                  description: OAuth client ID from the provider
                client_secret:
                  type: string
                  description: OAuth client secret (will be encrypted at rest)
                acceptable_client_ids:
                  type: array
                  items:
                    type: string
                  description: Additional acceptable client IDs for token validation
                scopes:
                  type: array
                  items:
                    type: string
                  description: OAuth scopes to request (OIDC providers will automatically include 'openid')
                  example:
                    - email
                    - profile
                pkce_enabled:
                  type: boolean
                  description: Enable PKCE (Proof Key for Code Exchange)
                  default: true
                attribute_mapping:
                  type: object
                  description: Map provider claims to user attributes (cannot map to protected system fields)
                  additionalProperties: true
                  example:
                    email: user_email
                    name: full_name
                authorization_params:
                  type: object
                  description: >-
                    Additional authorization request parameters as string key-value pairs (cannot override reserved
                    OAuth parameters)
                  additionalProperties:
                    type: string
                  example:
                    prompt: consent
                enabled:
                  type: boolean
                  description: Whether the provider is enabled
                  default: true
                email_optional:
                  type: boolean
                  description: Whether email is optional for users from this provider
                  default: false
                issuer:
                  type: string
                  format: uri
                  description: 'OIDC issuer URL (required for provider_type: oidc)'
                  example: https://accounts.google.com
                discovery_url:
                  type: string
                  format: uri
                  description: OIDC discovery URL (optional for OIDC, defaults to {issuer}/.well-known/openid-configuration)
                skip_nonce_check:
                  type: boolean
                  description: Skip nonce validation for OIDC (not recommended for production)
                  default: false
                authorization_url:
                  type: string
                  format: uri
                  description: 'OAuth 2.0 authorization endpoint (required for provider_type: oauth2)'
                  example: https://provider.com/oauth/authorize
                token_url:
                  type: string
                  format: uri
                  description: 'OAuth 2.0 token endpoint (required for provider_type: oauth2)'
                  example: https://provider.com/oauth/token
                userinfo_url:
                  type: string
                  format: uri
                  description: 'OAuth 2.0 userinfo endpoint (required for provider_type: oauth2)'
                  example: https://provider.com/oauth/userinfo
                jwks_uri:
                  type: string
                  format: uri
                  description: JWKS URI for token validation (optional for OAuth2)
            examples:
              oidc_provider:
                summary: Create OIDC provider
                value:
                  provider_type: oidc
                  identifier: mycompany
                  name: My Company SSO
                  client_id: your-client-id
                  client_secret: your-client-secret
                  issuer: https://accounts.mycompany.com
                  scopes:
                    - email
                    - profile
              oauth2_provider:
                summary: Create OAuth2 provider
                value:
                  provider_type: oauth2
                  identifier: customauth
                  name: Custom Auth Provider
                  client_id: your-client-id
                  client_secret: your-client-secret
                  authorization_url: https://provider.com/oauth/authorize
                  token_url: https://provider.com/oauth/token
                  userinfo_url: https://provider.com/oauth/userinfo
                  scopes:
                    - email
                    - profile
      responses:
        '201':
          description: Custom OIDC/OAuth provider created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomOAuthProviderSchema'
        '400':
          description: Bad request - validation failed, provider exists, or quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                validation_failed:
                  summary: validation_failed
                  value:
                    error_code: validation_failed
                    msg: issuer is required for OIDC providers
                provider_exists:
                  summary: conflict
                  value:
                    error_code: conflict
                    msg: A custom OAuth provider with this identifier already exists
                quota_exceeded:
                  summary: over_custom_provider_quota
                  value:
                    error_code: over_custom_provider_quota
                    msg: Maximum number of custom OIDC/OAuth providers reached
                reserved_name:
                  summary: validation_failed
                  value:
                    error_code: validation_failed
                    msg: 'Cannot use reserved provider name: google. This provider is already built into Frontal Auth.'
                discovery_fetch_failed:
                  summary: OIDC discovery fetch failed
                  value:
                    error_code: validation_failed
                    msg: >-
                      Failed to fetch OIDC discovery document from
                      "https://example.com/.well-known/openid-configuration"
                discovery_invalid:
                  summary: OIDC discovery missing required fields
                  value:
                    error_code: validation_failed
                    msg: 'OIDC discovery document is missing required fields: jwks_uri'
                discovery_issuer_mismatch:
                  summary: OIDC discovery issuer mismatch
                  value:
