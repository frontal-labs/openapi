openapi: 3.0.3
info:
  title: Frontal Public API
  version: 1.0.0
  description: >
    Public-facing APIs for external developers and applications


    **Included Services:**

    - **Frontal Auth REST API**: This is the REST API for [Frontal Auth](https://frontal.com/auth). Visit
    https://frontal.com/docs/guides/auth for complete documentation.


    **Notes:**

    - HTTP 5XX errors are not listed for each endpoint.
      These should be handled globally. Not all HTTP 5XX errors are generated from Auth, and they may serve non-JSON content. Make sure you inspect the `Content-Type` header before parsing as JSON.
    - Error responses are somewhat inconsistent.
      Avoid using the `msg` and HTTP status code to identify errors. HTTP 400 and 422 are used interchangeably in many APIs.
    - If the server has CAPTCHA protection enabled, the verification token should be included in the request body.

    - Rate limit errors are consistently raised with the HTTP 429 code.

    - Enums are used only in request bodies / parameters and not in responses to ensure wide compatibility with code
    generators that fail to include an unknown enum case.


    **OAuth Support:**

    - This service supports two OAuth modes:
      - **OAuth Client**: Endpoints tagged `oauth-client` are used when this service connects to external OAuth providers (like Google, GitHub)
      - **OAuth Server**: Endpoints tagged `oauth-server` are used when this service acts as an OAuth provider for other applications

    **Backward compatibility:**

    - Endpoints marked as _Experimental_ may change without notice.

    - Endpoints marked as _Deprecated_ will be supported for at least 3 months since being marked as deprecated.

    - HTTP status codes like 400, 404, 422 may change for the same underlying error condition.

    - **Identity Service API**: Identity and access management service for handling authentication, authorization, and
    user management.


    **Features:**

    - User authentication and authorization

    - Role-based access control (RBAC)

    - API key management

    - Team and workspace management

    - Policy enforcement

    - **Organization Service API**: Organization management service for handling company structures, departments, and
    organizational hierarchies.


    **Features:**

    - Company and department management

    - Organizational hierarchy

    - Employee management

    - Team structures

    - Role assignments

    - **Containers Service API**: Container management service for deploying, scaling, and managing containerized
    applications.


    **Features:**

    - Container deployment and management

    - Multi-cloud container orchestration

    - Auto-scaling and load balancing

    - Health monitoring and logging

    - Container networking

    - Resource management

    - **Functions Service API**: Serverless functions management service for deploying, managing, and executing edge
    functions.


    **Features:**

    - Function deployment and management

    - Project-based organization

    - Runtime configuration

    - Deployment history

    - Function monitoring

    - Edge execution

    - **Blob Storage Service API**: Object storage service for managing files, images, and binary data with multi-cloud
    support.


    **Features:**

    - File upload and download

    - Multi-cloud storage backends

    - Image processing and optimization

    - CDN integration

    - Access control and permissions

    - Storage analytics

    - **Webhooks Service API**: Webhook management service for handling event-driven integrations and real-time
    notifications.


    **Features:**

    - Webhook endpoint management

    - Event subscription and filtering

    - Event delivery and retry logic

    - Webhook authentication

    - Delivery logs and monitoring

    - Event history and replay

    - **Workflows Service API**: Workflow automation service for creating, managing, and executing automated workflows.


    **Features:**

    - Workflow creation and management

    - Visual workflow builder

    - Trigger-based automation

    - Workflow execution and monitoring

    - Template library

    - Integration with external services

    - **Avatar Service API**: Avatar generation and management service for creating and managing user avatars.


    **Features:**

    - AI-powered avatar generation

    - Avatar customization and styling

    - Image processing and optimization

    - Avatar templates and themes

    - Multi-format avatar export

    - Avatar analytics

    - **Marketplace Service API**: Integration marketplace service for discovering, installing, and managing third-party
    integrations.


    **Features:**

    - Integration discovery and browsing

    - Integration installation and management

    - Marketplace analytics

    - Integration reviews and ratings

    - Developer portal for integration submission

    - Integration usage tracking

    - **Feedback Service API**: User feedback and survey management service for collecting and analyzing user feedback.


    **Features:**

    - Feedback collection and management

    - Survey creation and distribution

    - Sentiment analysis

    - Feedback categorization

    - Analytics and reporting

    - Feedback response management


    **Authentication:**

    - OAuth 2.0 for user authorization

    - API keys for service authentication
