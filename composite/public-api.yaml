                  type: object
                  required:
                    - rpId
                    - rpOrigins
                  properties:
                    rpId:
                      type: string
                      description: The relying party identifier (usually the domain)
                    rpOrigins:
                      type: array
                      items:
                        type: string
                      minItems: 1
                      description: List of allowed origins for WebAuthn
      responses:
        '200':
          description: |
