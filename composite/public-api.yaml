  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication service
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service authentication
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            read: Read access
            write: Write access
            admin: Administrative access
    auth-UserAuth:
      type: http
      scheme: bearer
      description: |
        An access token in the form of a JWT issued by this server.
      x-service: auth
    auth-AdminAuth:
      type: http
      scheme: bearer
      description: |
        A special admin JWT.
      x-service: auth
    auth-APIKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: >
        When deployed on Frontal, this server requires an `apikey` header containing a valid Frontal-issued API key to
        call any endpoint.
      x-service: auth
    identity-BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-service: identity
    organization-BearerAuth:
