          type: boolean
          description: Skip nonce validation for OIDC (not recommended for production)
          default: false
        authorization_url:
          type: string
          format: uri
          description: OAuth 2.0 authorization endpoint (required for OAuth2 providers)
        token_url:
          type: string
          format: uri
          description: OAuth 2.0 token endpoint (required for OAuth2 providers)
        userinfo_url:
