        schema:
          type: string
          pattern: ^custom:[a-zA-Z0-9_-]+$
        example: custom:mycompany
    get:
      summary: Get custom OIDC/OAuth provider details
      description: >
        Retrieves details of a specific custom OIDC/OAuth provider. Only available when custom OIDC/OAuth providers are
        enabled.
      tags:
        - auth:admin
        - auth:oauth-client
      security:
        - APIKeyAuth: []
          AdminAuth: []
      responses:
        '200':
          description: Custom OIDC/OAuth provider details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomOAuthProviderSchema'
        '400':
          description: Invalid identifier format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                validation_failed:
                  summary: validation_failed
                  value:
                    error_code: validation_failed
                    msg: identifier must start with 'custom:' prefix
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                not_found:
                  summary: custom_provider_not_found
                  value:
                    error_code: custom_provider_not_found
                    msg: Custom OAuth provider not found
      x-service: auth
    put:
      summary: Update custom OIDC/OAuth provider
      description: >
        Updates an existing custom OIDC/OAuth provider. All fields are optional. Only provided fields will be updated.
        Only available when custom OIDC/OAuth providers are enabled. When `issuer` or `discovery_url` is changed on an
        OIDC provider, the server re-fetches and validates the discovery document before persisting.
      tags:
        - auth:admin
        - auth:oauth-client
      security:
        - APIKeyAuth: []
          AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable display name
                client_id:
                  type: string
                  description: OAuth client ID
                client_secret:
                  type: string
                  description: OAuth client secret (only provide if changing, will be encrypted)
                acceptable_client_ids:
                  type: array
                  items:
                    type: string
                  description: Additional acceptable client IDs
                scopes:
                  type: array
                  items:
                    type: string
                  description: OAuth scopes to request
                pkce_enabled:
                  type: boolean
                  description: Enable PKCE
                attribute_mapping:
                  type: object
                  description: Map provider claims to user attributes
                  additionalProperties: true
                authorization_params:
                  type: object
                  description: Additional authorization request parameters as string key-value pairs
                  additionalProperties:
                    type: string
                enabled:
                  type: boolean
                  description: Whether the provider is enabled
                email_optional:
                  type: boolean
                  description: Whether email is optional
                issuer:
                  type: string
                  format: uri
                  description: OIDC issuer URL (for OIDC providers)
                discovery_url:
                  type: string
                  format: uri
                  description: OIDC discovery URL (for OIDC providers)
                skip_nonce_check:
                  type: boolean
                  description: Skip nonce validation for OIDC
                authorization_url:
                  type: string
                  format: uri
                  description: OAuth 2.0 authorization endpoint (for OAuth2 providers)
                token_url:
                  type: string
                  format: uri
                  description: OAuth 2.0 token endpoint (for OAuth2 providers)
                userinfo_url:
                  type: string
                  format: uri
                  description: OAuth 2.0 userinfo endpoint (for OAuth2 providers)
                jwks_uri:
                  type: string
                  format: uri
                  description: JWKS URI for token validation (for OAuth2 providers)
            examples:
              update_name:
                summary: Update provider name
                value:
                  name: Updated Company Name
              update_scopes:
                summary: Update scopes
                value:
                  scopes:
                    - openid
                    - email
                    - profile
                    - groups
      responses:
        '200':
          description: Custom OIDC/OAuth provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomOAuthProviderSchema'
        '400':
          description: Invalid identifier, validation failed, or OIDC discovery validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                validation_failed:
                  summary: validation_failed
                  value:
                    error_code: validation_failed
                    msg: identifier must start with 'custom:' prefix
                discovery_fetch_failed:
                  summary: OIDC discovery fetch failed
                  value:
                    error_code: validation_failed
                    msg: >-
                      Failed to fetch OIDC discovery document from
                      "https://example.com/.well-known/openid-configuration"
                discovery_issuer_mismatch:
                  summary: OIDC discovery issuer mismatch
                  value:
                    error_code: validation_failed
                    msg: >-
                      OIDC discovery issuer mismatch: discovery document reports "https://other.example.com" but
                      expected "https://example.com"
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      x-service: auth
    delete:
      summary: Delete custom OIDC/OAuth provider
      description: >
        Permanently removes a custom OIDC/OAuth provider configuration. Only available when custom OIDC/OAuth providers
        are enabled.
      tags:
        - auth:admin
