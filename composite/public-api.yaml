        - auth:user
      security:
        - APIKeyAuth: []
          UserAuth: []
      parameters:
        - name: factorId
          in: path
          required: true
          example: 2b306a77-21dc-4110-ba71-537cb56b9e98
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >
            This MFA factor is removed (unenrolled) and cannot be used for increasing the AAL level of user's sessions.
            Client libraries should use the `POST /token?grant_type=refresh_token` endpoint to get a new access and
            refresh token with a decreased AAL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 2b306a77-21dc-4110-ba71-537cb56b9e98
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      x-service: auth
  /v1/auth/callback:
    get:
      summary: Redirects OAuth flow errors to the frontend app.
      description: >
        When an OAuth sign-in flow fails for any reason, the error message needs to be delivered to the frontend app
        requesting the flow. This callback delivers the errors as `error` and `error_description` query params. Usually
        this request is not called directly.
      tags:
        - auth:oauth-client
      security:
        - APIKeyAuth: []
      responses:
        '302':
          $ref: '#/components/responses/OAuthCallbackRedirectResponse'
      x-service: auth
    post:
      summary: Redirects OAuth flow errors to the frontend app.
      description: >
        When an OAuth sign-in flow fails for any reason, the error message needs to be delivered to the frontend app
        requesting the flow. This callback delivers the errors as `error` and `error_description` query params. Usually
        this request is not called directly.
      tags:
        - auth:oauth-client
      responses:
        '302':
          $ref: '#/components/responses/OAuthCallbackRedirectResponse'
      x-service: auth
  /v1/auth/sso:
    post:
      summary: Initiate a Single-Sign On flow.
      tags:
        - auth:sso
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  format: hostname
                  description: Email address domain used to identify the SSO provider.
                provider_id:
                  type: string
                  format: uuid
                  example: 40451fc2-4997-429c-bf7f-cc6f33c788e6
                redirect_to:
                  type: string
                  format: uri
                skip_http_redirect:
                  type: boolean
                  description: >-
                    Set to `true` if the response to this request should not be a HTTP 303 redirect -- useful for
                    browser-based applications.
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum:
                    - plain
                    - s256
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
      responses:
        '200':
          description: >
            Returned only when `skip_http_redirect` is `true` and the SSO provider could be identified from the
            `provider_id` or `domain`. Client libraries should use the returned URL to redirect or open a browser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '303':
          description: >
            Returned only when `skip_http_redirect` is `false` or not present and the SSO provider could be identified
            from the `provider_id` or `domain`. Client libraries should follow the redirect. 303 is used instead of 302
            because the request should be executed with a `GET` verb.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          description: |
            Returned when the SSO provider could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      x-service: auth
  /v1/auth/saml/metadata:
    get:
      summary: Returns the SAML 2.0 Metadata XML.
      description: >
        The metadata XML can be downloaded or used for the SAML 2.0 Metadata URL discovery mechanism. This URL is the
        SAML 2.0 EntityID of the Service Provider implemented by this server.
      tags:
        - auth:saml
      security:
        - APIKeyAuth: []
      parameters:
        - name: download
          in: query
          description: >
            If set to `true` will add a `Content-Disposition` header to the response which will trigger a download
            dialog on the browser.
          schema:
            type: boolean
      responses:
        '200':
          description: >
            A valid SAML 2.0 Metadata XML document. Should be cached according to the `Cache-Control` header and/or
            caching data specified in the document itself.
          headers:
            Content-Disposition:
              description: |
                Present if `download=true`, which triggers the browser to show a donwload dialog.
              schema:
                type: string
                example: attachment; filename="metadata.xml"
            Cache-Control:
              description: |
                Should be parsed and obeyed to avoid putting strain on the server.
              schema:
                type: string
                example: public, max-age=600
      x-service: auth
  /v1/auth/saml/acs:
    post:
      summary: SAML 2.0 Assertion Consumer Service (ACS) endpoint.
      description: |
        Implements the SAML 2.0 Assertion Consumer Service (ACS) endpoint supporting the POST and Artifact bindings.
      tags:
        - auth:saml
      security: []
      parameters:
        - name: RelayState
          in: query
          schema:
            oneOf:
              - type: string
                format: uri
                description: >-
                  URL to take the user to after the ACS has been verified. Often sent by Identity Provider initiated
                  login requests.
              - type: string
                format: uuid
                description: >-
                  UUID of the SAML Relay State stored in the database, used to identify the Service Provider initiated
                  login request.
        - name: SAMLArt
          in: query
          description: |
            See the SAML 2.0 ACS specification. Cannot be used without a UUID `RelayState` parameter.
          schema:
            type: string
        - name: SAMLResponse
          in: query
          description: >
            See the SAML 2.0 ACS specification. Must be present unless `SAMLArt` is specified. If `RelayState` is not a
            UUID, the SAML Response is unpacked and the identity provider is identified from the response.
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/AccessRefreshTokenRedirectResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
