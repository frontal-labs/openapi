paths:
  /v1/auth/token:
    post:
      summary: Issues access and refresh tokens based on grant type.
      tags:
        - auth:auth
      parameters:
        - name: grant_type
          in: query
          required: true
          description: >
            - What grant type should be used to issue an access and refresh token. Note: `id_token` is only offered in
            experimental mode.

            - CAPTCHA protection does not apply on the `refresh_token` grant flow.

            - Using `password` is akin to a user signing in.

            - `pkce` is used for exchanging the authorization code for a pair of access and refresh tokens.
          schema:
            type: string
            enum:
              - password
              - refresh_token
              - id_token
              - pkce
              - web3
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            examples:
              grant_type=password:
                value:
                  email: user@frontal.dev
                  password: password1
              grant_type=refresh_token:
                value:
                  refresh_token: 4nYUCw0wZR_DNOTSDbSGMQ
              grant_type=pkce:
                value:
                  auth_code: 009e5066-fc11-4eca-8c8c-6fd82aa263f2
                  code_verifier: >-
                    ktPNXpR65N6JtgzQA8_5HHtH6PBSAahMNoLKRzQEa0Tzgl.vdV~b6lPk004XOd.4lR0inCde.NoQx5K63xPfzL8o7tJAjXncnhw5Niv9ycQ.QRV9JG.y3VapqbgLfIrJ
              web3_solana:
                value:
                  message: |-
                    example.com wants you to sign in with your Solana account:
                    0x1234...5678

                    Sign in with Solana

                    URI: https://example.com
                    Version: 1
                    Nonce: abc123def456
                    Issued At: 2023-09-19T12:00:00Z
                  signature: base64_encoded_signature_string
                  chain: solana
              web3_ethereum:
                value:
                  message: |-
                    example.com wants you to sign in with your Ethereum account:
                    0x1234567890123456789012345678901234567890

                    Sign in with Ethereum

                    URI: https://example.com
                    Version: 1
                    Issued At: 2023-09-19T12:00:00Z
                  signature: >-
                    0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1b
                  chain: ethereum
            schema:
              type: object
              description: >-
                For the refresh token flow, supply only `refresh_token`.

                For the email/phone with password flow, supply `email`, `phone` and `password` with an optional
                `gotrue_meta_security`.

                For the OIDC ID token flow, supply `id_token`, `nonce`, `provider`, `client_id`, `issuer` with an
                optional `gotrue_meta_security`.

                For the Web3 flow, supply `message`, `signature`, and `chain`.
              properties:
                refresh_token:
                  type: string
                password:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  format: phone
                id_token:
                  type: string
                access_token:
                  type: string
                  description: >-
                    Provide only when `grant_type` is `id_token` and the provided ID token requires the presence of an
                    access token to be accepted (usually by having an `at_hash` claim).
                nonce:
                  type: string
                provider:
                  type: string
                  enum:
                    - google
                    - apple
                    - azure
                    - facebook
                    - keycloak
                client_id:
                  type: string
                issuer:
                  type: string
                  description: >-
                    If `provider` is `azure` then you can specify any Azure OIDC issuer string here, which will be used
                    for verification.
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
                auth_code:
                  type: string
                  format: uuid
                code_verifier:
                  type: string
                message:
                  type: string
                  description: >
                    Signed message for Web3 authentication following the Sign in with Solana (SIWS) or Sign in with
                    Ethereum (SIWE) standard. Must include: `Issued At`, `URI`, `Version`.
                signature:
                  type: string
                  description: |
                    The signature of the message for Web3 authentication.
                    For Solana: Base64 or Base64-URL encoded.
                    For Ethereum: hexadecimal string with 0x prefix.
                chain:
                  type: string
                  description: What blockchain is the Web3 message and signature for.
                  enum:
                    - solana
                    - ethereum
                  example: solana
      responses:
        '200':
          description: |
            An access and refresh token have been successfully issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseSchema'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/ForbiddenResponse'
        '403':
          $ref: '#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      x-service: auth
  /v1/auth/logout:
    post:
      summary: Logs out a user.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
          UserAuth: []
      parameters:
        - name: scope
          in: query
          description: >
            (Optional.) Determines how the user should be logged out. When `global` is used, the user is logged out from
            all active sessions. When `local` is used, the user is logged out from the current session. When `others` is
            used, the user is logged out from all other sessions except the current one. Clients should remove stored
            access and refresh tokens except when `others` is used.
          schema:
            type: string
            enum:
              - global
              - local
              - others
      responses:
        '204':
          description: No content returned on successful logout.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
      x-service: auth
  /v1/auth/verify:
    get:
      summary: Authenticate by verifying the possession of a one-time token. Usually for use as clickable links.
      tags:
        - auth:auth
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - signup
              - invite
              - recovery
              - magiclink
              - email_change
        - name: redirect_to
          in: query
          description: >
            (Optional) URL to redirect back into the app on after verification completes successfully. If not specified
            will use the "Site URL" configuration option. If not allowed per the allow list it will use the "Site URL"
            configuration option.
          schema:
            type: string
            format: uri
      security:
        - APIKeyAuth: []
      responses:
        '302':
          $ref: '#/components/responses/AccessRefreshTokenRedirectResponse'
      x-service: auth
    post:
      summary: Authenticate by verifying the possession of a one-time token.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - signup
                    - recovery
                    - invite
                    - magiclink
                    - email_change
                    - sms
                    - phone_change
                token:
                  type: string
                token_hash:
                  type: string
                  description: |
                    The hashed value of token. Applicable only if used with `type` and nothing else.
                email:
                  type: string
                  format: email
                  description: |
                    Applicable only if `type` is with regards to an email address.
                phone:
                  type: string
                  format: phone
                  description: |
                    Applicable only if `type` is with regards to an phone number.
                redirect_to:
                  type: string
                  format: uri
                  description: >
                    (Optional) URL to redirect back into the app on after verification completes successfully. If not
                    specified will use the "Site URL" configuration option. If not allowed per the allow list it will
                    use the "Site URL" configuration option.
      responses:
        '200':
          description: An access and refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseSchema'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/authorize:
    get:
      summary: Redirects to an external OAuth provider. Usually for use as clickable links.
      tags:
        - auth:oauth-client
      security:
        - APIKeyAuth: []
      parameters:
        - name: provider
          in: query
          description: Name of the OAuth provider.
          example: google
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9]+$
        - name: scopes
          in: query
          required: true
          description: Space separated list of OAuth scopes to pass on to `provider`.
          schema:
            type: string
            pattern: '[^ ]+( +[^ ]+)*'
        - name: invite_token
          in: query
          description: >-
            (Optional) A token representing a previous invitation of the user. A successful sign-in with OAuth will mark
            the invitation as completed.
          schema:
            type: string
        - name: redirect_to
          in: query
          description: >
            (Optional) URL to redirect back into the app on after OAuth sign-in completes successfully or not. If not
            specified will use the "Site URL" configuration option. If not allowed per the allow list it will use the
            "Site URL" configuration option.
          schema:
            type: string
            format: uri
        - name: code_challenge_method
          in: query
          description: >-
            (Optional) Method used to encrypt the verifier. Can be `plain` (no transformation) or `s256` (where SHA-256
            is used). It is always recommended that `s256` is used.
          schema:
            type: string
            enum:
              - plain
              - s256
      responses:
        '302':
          $ref: '#/components/responses/OAuthAuthorizeRedirectResponse'
      x-service: auth
  /v1/auth/signup:
    post:
      summary: Signs a user up.
      description: |
        Creates a new user.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            examples:
              email+password:
                value:
                  email: user@frontal.dev
                  password: password1
              phone+password:
                value:
                  phone: '+1234567890'
                  password: password1
              phone+password+whatsapp:
                value:
                  phone: '+1234567890'
                  password: password1
                  channel: whatsapp
              email+password+pkce:
                value:
                  email: user@frontal.dev
                  password: password1
                  code_challenge_method: s256
                  code_challenge: elU6u5zyqQT2f92GRQUq6PautAeNDf4DQPayyR0ek_c&
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  format: phone
                channel:
                  type: string
                  enum:
                    - sms
                    - whatsapp
                password:
                  type: string
                data:
                  type: object
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum:
                    - plain
                    - s256
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
      responses:
        '200':
          description: >
            A user already exists and is not confirmed (in which case a user object is returned). A user did not exist
            and is signed up. If email or phone confirmation is enabled, returns a user object. If confirmation is
            disabled, returns an access token and refresh token response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponseSchema'
                  - $ref: '#/components/schemas/UserSchema'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/recover:
    post:
      summary: Request password recovery.
      description: |
        Users that have forgotten their password can have it reset with this API.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum:
                    - plain
                    - s256
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
      responses:
        '200':
          description: >-
            A recovery email has been sent to the address. An empty JSON object is returned. To obfuscate whether such
            an email address already exists in the system this response is sent regardless whether the address exists or
            not.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          description: Returned when unable to validate the email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/resend:
    post:
      summary: Resends a one-time password (OTP) through email or SMS.
      description: |
        Allows a user to resend an existing signup, sms, email_change or phone_change OTP.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: |
                    Applicable only if `type` is with regards to an email address.
                phone:
                  type: string
                  format: phone
                  description: |
                    Applicable only if `type` is with regards to an phone number.
                type:
                  type: string
                  enum:
                    - signup
                    - email_change
                    - sms
                    - phone_change
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
      responses:
        '200':
          description: >-
            A One-Time Password was sent to the email or phone. To obfuscate whether such an address or number already
            exists in the system this response is sent in both cases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    description: >-
                      Unique ID of the message as reported by the SMS sending provider. Useful for tracking
                      deliverability problems.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          description: Returned when unable to validate the email address or phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/magiclink:
    post:
      summary: Authenticate a user by sending them a magic link.
      description: >
        A magic link is a special type of URL that includes a One-Time Password. When a user visits this link in a
        browser they are immediately authenticated.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                data:
                  type: object
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
      responses:
        '200':
          description: >-
            A recovery email has been sent to the address. An empty JSON object is returned. To obfuscate whether such
            an email address already exists in the system this response is sent regardless whether the address exists or
            not.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          description: Returned when unable to validate the email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      x-service: auth
  /v1/auth/otp:
    post:
      summary: Authenticate a user by sending them a One-Time Password over email or SMS.
      tags:
        - auth:auth
      security:
        - APIKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  format: phone
                channel:
                  type: string
                  enum:
                    - sms
                    - whatsapp
                create_user:
                  type: boolean
                data:
                  type: object
                code_challenge_method:
                  type: string
                  enum:
                    - s256
                    - plain
                code_challenge:
                  type: string
                gotrue_meta_security:
                  $ref: '#/components/schemas/GoTrueSecurity'
      responses:
        '200':
          description: >-
            A One-Time Password was sent to the email or phone. To obfuscate whether such an address or number already
            exists in the system this response is sent in both cases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    description: >-
                      Unique ID of the message as reported by the SMS sending provider. Useful for tracking
                      deliverability problems.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
