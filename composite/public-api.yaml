    auth-OAuthCallbackRedirectResponse:
      description: >
        HTTP Redirect to a URL containing the `error` and `error_description` query parameters which should be shown to
        the user requesting the OAuth sign-in flow.
      headers:
        Location:
          description: |
            URL containing the `error` and `error_description` query parameters.
          schema:
            type: string
            format: uri
            example: https://example.com/?error=server_error&error_description=User%20does%20not%20exist.
      x-service: auth
    auth-OAuthAuthorizeRedirectResponse:
      description: |
        HTTP Redirect to the OAuth identity provider's authorization URL.
      headers:
        Location:
          description: |
            URL to which the user agent should redirect (or open in a browser for mobile apps).
          schema:
            type: string
            format: uri
      x-service: auth
    auth-RateLimitResponse:
      description: |
        HTTP Too Many Requests response, when a rate limiter has been breached.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 429
              msg:
                type: string
                description: A basic message describing the rate limit breach. Do not use as an error code identifier.
                example: Too many requests. Please try again in a few seconds.
      x-service: auth
    auth-BadRequestResponse:
      description: >
        HTTP Bad Request response. Can occur if the passed in JSON cannot be unmarshalled properly or when CAPTCHA
        verification was not successful. In certain cases can also occur when features are disabled on the server (e.g.
        sign ups). It may also mean that the operation failed due to some constraint not being met (such a user already
        exists for example).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
      x-service: auth
    auth-UnauthorizedResponse:
      description: |
        HTTP Unauthorized response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
      x-service: auth
    auth-ForbiddenResponse:
      description: |
        HTTP Forbidden response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
      x-service: auth
    auth-InternalServerErrorResponse:
      description: |
        HTTP Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
      x-service: auth
    auth-AccessRefreshTokenRedirectResponse:
      description: >
        HTTP See Other redirect response where `Location` is a specially formatted URL that includes an `access_token`,
        `refresh_token`, `expires_in` as URL query encoded values in the URL fragment (anything after `#`). These values
        are encoded in the fragment as this value is only visible to the browser handling the redirect and is not sent
        to the server.
      headers:
        Location:
          schema:
            type: string
            format: uri
            example: https://example.com/#access_token=...&refresh_token=...&expires_in=...
      x-service: auth
