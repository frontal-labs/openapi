paths:
  /v1/metrics/v1/metrics:
    get:
      tags:
        - metrics:metrics
      summary: Query metrics
      description: Retrieve metrics data with filtering and aggregation
      operationId: queryMetrics
      security:
        - BearerAuth: []
      parameters:
        - name: metric_name
          in: query
          description: Name of the metric to query
          schema:
            type: string
          required: true
        - name: start_time
          in: query
          description: Start time for query range
          schema:
            type: string
            format: date-time
          required: true
        - name: end_time
          in: query
          description: End time for query range
          schema:
            type: string
            format: date-time
          required: true
        - name: aggregation
          in: query
          description: Aggregation function
          schema:
            type: string
            enum:
              - avg
              - sum
              - min
              - max
              - count
        - name: interval
          in: query
          description: Time interval for aggregation
          schema:
            type: string
            enum:
              - 1m
              - 5m
              - 15m
              - 1h
              - 1d
        - name: labels
          in: query
          description: Label filters (key=value format, comma-separated)
          schema:
            type: string
      responses:
        '200':
          description: Metrics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-service: metrics
    post:
      tags:
        - metrics:metrics
      summary: Record metrics
      description: Record new metric data points
      operationId: recordMetrics
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMetricsRequest'
      responses:
        '201':
          description: Metrics recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-service: metrics
  /v1/metrics/v1/metrics/names:
