openapi: 3.0.3
info:
  title: Frontal Internal API
  version: 1.0.0
  description: >
    Internal service-to-service communication APIs


    **Included Services:**

    - **Metrics Service API**: Metrics collection and monitoring service for application and infrastructure metrics.


    **Features:**

    - Time-series metrics collection

    - Custom metric definitions

    - Metric aggregation and querying

    - Dashboard integration

    - Alert management

    - **Logging Service API**: Centralized logging service for application and infrastructure logs.


    **Features:**

    - Log ingestion and storage

    - Log searching and filtering

    - Log aggregation and parsing

    - Retention policies

    - Log streaming

    - **Support Service API**: Customer support and help desk service for managing support tickets and customer
    interactions.


    **Features:**

    - Support ticket management

    - Customer communication

    - Knowledge base integration

    - Issue tracking

    - Support analytics

    - **Regions Service API**: Geographic region management service for multi-region deployments and infrastructure.


    **Features:**

    - Region management and configuration

    - Geographic distribution

    - Multi-region deployment support

    - Region health monitoring

    - Cross-region networking

    - **Deployments Service API**: Application deployment management service for handling container deployments,
    rollouts, and infrastructure management.


    **Features:**

    - Application deployment and management

    - Rolling updates and rollbacks

    - Environment management

    - Deployment history and monitoring

    - Infrastructure provisioning

    - Health checks and monitoring

    - **Status Service API**: System status and monitoring service for tracking service health, incidents, and
    maintenance.


    **Features:**

    - Service health monitoring

    - Incident management

    - Maintenance scheduling

    - Performance metrics

    - Status page generation

    - Alert management


    **Authentication:**

    - JWT tokens for service authentication

    - mTLS for secure service communication
