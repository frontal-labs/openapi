      parameters:
        - name: query
          in: query
          description: Search query string
          schema:
            type: string
        - name: start_time
          in: query
          description: Start time for search range
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: End time for search range
          schema:
            type: string
            format: date-time
        - name: level
          in: query
          description: Filter by log level
          schema:
            type: string
            enum:
              - debug
              - info
              - warn
              - error
              - fatal
        - name: service
          in: query
          description: Filter by service name
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
