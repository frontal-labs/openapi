name: Generate Composite Specs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    name: Generate Composite Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate composite specifications
        run: npm run generate:composite

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: composite-specs
          path: |
            composite/
          retention-days: 7